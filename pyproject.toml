[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbus-evcharger"
version = "0.1.0"
description = "Home-Assistant-backed EV charger bridge for Victron Venus OS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.9",
]

[tool.setuptools]
packages = ["dbus_evcharger"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "E722",  # bare except tolerated, matches sibling services
    "F841",
]

[tool.pylint.messages_control]
disable = [
    "E0401",  # Unable to import (Venus OS libs absent off-device)
    "C0103", "C0116", "C0301", "C0413",
    "R0902", "R0903", "R0913", "R0914", "R0915",
    "W0718", "W1203", "W0613",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dbus_evcharger --cov-report=term-missing --cov-fail-under=80"
