sonar.organization=victron-venus
sonar.projectKey=victron-venus_dbus-evcharger
sonar.sources=.
# Reviewed python:S8707 false positives in the frozen shared release helpers.
# prepare_version.py writes validated version text as content to fixed pr-body.md;
# release_versioned.py writes manifest content to a fixed private stage destination.
# Neither content value selects the output path. Automatic Analysis supports exact
# file exclusions here, so retain analysis of the other release helpers.
sonar.exclusions=**/test_*.py,**/tests/**,logs/**,.venv/**,local_config.example.py,scripts/prepare_version.py,scripts/release_versioned.py
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

# update_charging() has 14 params (L1 + L2 phase data) — no good grouping exists
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S107
sonar.issue.ignore.multicriteria.e1.resourceKey=dbus_evcharger/service.py

# local_config.example.py is a user-edited LAN template, not application logic.
# HTTP remains valid for Home Assistant installations without local TLS.
